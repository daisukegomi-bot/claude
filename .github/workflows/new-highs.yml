name: kabutan new highs (1y+, close basis)

on:
  schedule:
    # 平日 16:45 JST (= 07:45 UTC)。大引け後に実行
    - cron: "45 7 * * 1-5"
  workflow_dispatch:
    inputs:
      min_days:
        description: "何日以上ぶりを対象にするか"
        default: "365"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Check kabutan reachability
        run: |
          curl -sS -o /dev/null -w "kabutan status: %{http_code}\n" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept-Language: ja" "https://kabutan.jp/warning/?mode=3_1" || true
      - name: Scrape kabutan
        run: |
          python kabutan_new_highs.py --min-days "${{ github.event.inputs.min_days || '365' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results && git add results/
          git diff --cached --quiet || git commit -m "results: $(date -u +%F) new highs"
          git push
